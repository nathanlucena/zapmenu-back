# Copiar para .github/workflows/claude-review.yml no zapmenu-back.
# Secret necessário (Settings > Secrets and variables > Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  -> gerado com `claude setup-token` (usa sua assinatura Claude)
#   ou ANTHROPIC_API_KEY     -> chave da API (cobrança por uso); troque a linha marcada abaixo.
name: Revisão Claude (back)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  # Permite pedir algo pontual comentando "@claude ..." na PR.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  revisar:
    # Revisão automática em PRs que não são rascunho.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} # ou: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            Você é o revisor do zapmenu-back. Escreva tudo em português.
            Leia o CLAUDE.md e o README do repositório, se existirem, e siga as convenções deles.

            Stack: Node 24 + TypeScript (ESM, imports com .js), Fastify 5, Prisma 7 (Postgres),
            Zod 4, Pino, Vitest, Baileys (WhatsApp), Mercado Pago, DeepSeek, Google Geocoding.
            Arquitetura limpa por módulo (domain / application/ports / infra / http),
            verificada pelo dependency-cruiser.

            Foque, em ordem de prioridade:
            1. Bugs e regressões: cálculo de preço/total/entrega, estados do pedido, casos de borda,
               promessas sem await, erros engolidos.
            2. Segurança: validação com Zod em toda rota e webhook, assinatura do webhook do
               Mercado Pago, segredos ou tokens no código/logs, dados pessoais (telefone, endereço) em logs.
            3. Arquitetura: domain e application não importam infra, http, Prisma ou SDKs externos;
               regra de negócio fora das rotas Fastify; integrações externas atrás de ports.
            4. Prisma: migrações que perdem dados, NOT NULL sem default, falta de índice em filtro novo,
               N+1, operações que deveriam estar em transação, schema e migration fora de sincronia.
            5. Integrações: Baileys (reconexão, sessão, mensagens duplicadas), cota/custo do Google Maps
               e da DeepSeek, idempotência de webhooks e do poller de pagamento.
            6. Testes: caso de uso novo sem teste, fakes que divergem da implementação real.

            Não comente estilo que o lint já cobre nem faça elogios genéricos.
            Use comentários inline (mcp__github_inline_comment__create_inline_comment) para
            problemas em linhas específicas, e um único comentário final com `gh pr comment`
            resumindo: veredito (pode mesclar / precisa de ajustes) e a lista curta dos problemas
            por gravidade. Se não achar nada relevante, diga isso em uma linha.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

  responder:
    # Atende "@claude ..." em comentários de PR.
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
